{% extends "base.html" %}
{% block title %}New User — Maintenance Department Portal{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Create a user account</h1>
  <form method="post" action="{{ url_for('auth.new_user') }}">
    <label for="name">Full name *</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email address *</label>
    <input type="email" id="email" name="email" required>
    <label for="role">Role *</label>
    <select id="role" name="role">
      {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
    </select>
    <label for="password">Password *</label>
    <input type="password" id="password" name="password" required>
    <button type="submit" class="btn">Create user</button>
    <a class="btn btn-secondary" href="{{ url_for('auth.list_users') }}">Cancel</a>
  </form>
</div>
{% endblock %}
